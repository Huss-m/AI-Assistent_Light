name: Deploy to Cloud Run
on:
  push:
    branches: [ dev ]

env:
  GCP_PROJECT_ID: delta-compass-477214-e7
  GCP_REGION: europe-north1
  REPOSITORY: ai-assistant-repo
  SERVICE: ai-assistant-light

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${GCP_REGION}-docker.pkg.dev --quiet

      - name: Compute image tag
        id: vars
        run: echo "TAG=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Build & push
        id: buildpush
        run: |
          IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${REPOSITORY}/${SERVICE}:${{ steps.vars.outputs.TAG }}"
          docker build -t "$IMAGE" ai-assistant-light
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> $GITHUB_OUTPUT

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${SERVICE} \
            --image="${{ steps.buildpush.outputs.IMAGE }}" \
            --region=${GCP_REGION} \
            --platform=managed \
            --allow-unauthenticated \
            --cpu=1 --memory=512Mi --max-instances=5 --concurrency=80 \
            --set-env-vars="PYTHONUNBUFFERED=1,ENV=prod,OAUTHLIB_RELAX_TOKEN_SCOPE=1" \
            --set-env-vars="GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" \
            --set-env-vars="GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}" \
            --set-env-vars="GOOGLE_REDIRECT_URI=https://ai-assistant-light-1080004701891.europe-north1.run.app/auth/callback" \
            --set-env-vars="SESSION_SECRET_KEY=${{ secrets.SESSION_SECRET_KEY }}" \
            --set-env-vars="CREDENTIAL_ENC_KEY=${{ secrets.CREDENTIAL_ENC_KEY }}" \
            --set-env-vars="OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" \
            --port=8080
