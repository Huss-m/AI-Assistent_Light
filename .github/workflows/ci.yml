name: CI

on:
  pull_request:
    branches: [ main, dev ]
  push:
    branches: [ dev ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    # 👇 Lägg till detta så alla `run:` körs inne i ai-assistant-light
    defaults:
      run:
        working-directory: ai-assistant-light

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
          pip install pytest ruff mypy

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy src

      - name: Tests (pytest)
        run: pytest -q

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/ai-assistant
          tags: |
            type=ref,event=pr
            type=raw,value=dev
            type=sha,format=short

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push (GHCR)
        uses: docker/build-push-action@v6
        with:
          # 👇 bygg från mappen ai-assistant-light
          context: ai-assistant-light
          push: true
          tags: ${{ steps.meta.outputs.tags }}
